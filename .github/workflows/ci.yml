name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  # Verify the shipped .d.ts type declarations stay valid across the
  # TypeScript versions consumers may build with. 5.5 is the minimum
  # supported; 6.x and 7.x are current stable releases; 'next' is the
  # in-development preview and is allowed to fail.
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ts: '5.5'
            experimental: false
          - ts: '5'
            experimental: false
          - ts: '6'
            experimental: false
          - ts: '7'
            experimental: false
          - ts: 'next'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pin TypeScript ${{ matrix.ts }}
        run: npm install --no-save typescript@${{ matrix.ts }}

      - name: Print TypeScript version
        run: npx tsc --version

      - name: Typecheck declarations
        run: npm run typecheck
