name: Publish package

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

      - name: Verify package contents
        run: npm pack --dry-run

      - id: check-published-version
        name: Check if version already exists on npm
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION already exists on npm, skipping publish."
          else
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing: OIDC via id-token permission, no NPM_TOKEN needed.
      # Provenance is attached automatically. Requires a trusted publisher
      # configured on npmjs.com for this repo + workflow (publish.yml).
      - name: Publish to npm
        if: steps.check-published-version.outputs.skip_publish == 'false'
        run: npm publish --access public

      - name: Create GitHub Release
        if: steps.check-published-version.outputs.skip_publish == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check-published-version.outputs.version }}
          name: v${{ steps.check-published-version.outputs.version }}
          generate_release_notes: true
